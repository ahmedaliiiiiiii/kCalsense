name: kcalsense
description: "A Flutter food recognition app for nutrition tracking."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  provider: ^6.1.5+1
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  equatable: ^2.0.8
  shared_preferences: ^2.5.3
  permission_handler: ^11.0.1
  image_picker: ^1.2.1
  dio: ^5.9.1
  google_generative_ai: ^0.4.7
  animated_text_kit: ^4.3.0
  intl: ^0.20.2
  fl_chart: ^0.66.0
  flutter_dotenv: ^6.0.0
  easy_localization: ^3.0.8
  flutter_localization: ^0.3.3
  animated_toggle_switch: ^0.8.2
  path_provider: ^2.1.5
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/pictures/
    - assets/icon/
    - assets/translations/


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"